services:
  notes-interface:
    build: .
    ports:
      # 8100, not the 8080 in PROJECT.md 10.2 - overridden for this
      # deployment.
      - "8100:8100"
    environment:
      QUEUE_DIR: /data/queue
      VAULT_DIR: /data/vault
      ARCHIVE_DIR: /data/archive
      PASSWORD_HASH: ${PASSWORD_HASH}
      SECRET_KEY: ${SECRET_KEY}
      # Optional - see .env.example. Leave unset in .env to skip the
      # Tandoor push entirely.
      TANDOOR_URL: ${TANDOOR_URL:-}
      TANDOOR_API_TOKEN: ${TANDOOR_API_TOKEN:-}
      # Required for item chat (see .env.example) - leave unset and chat
      # requests fail with a clear error, but nothing else is affected.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
    volumes:
      - E:\notes-system\queue:/data/queue
      - E:\notes:/data/vault
      - E:\notes\Archive\Captures:/data/archive:ro
    restart: unless-stopped
    healthcheck:
      # No curl/wget in python:3.12-slim - use the stdlib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
