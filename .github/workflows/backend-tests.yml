name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default - this job only checks out code and runs pytest,
# it never needs to write anything back to the repo.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v
